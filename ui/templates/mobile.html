<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AirLink Mobile</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: #1a1614;
            color: #b0b5be;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 16px;
        }
        .container {
            width: 100%;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .card {
            background: rgba(38, 33, 30, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 24px 20px;
            box-shadow: 0 12px 28px rgba(15, 12, 10, 0.45);
        }
        .node-status {
            text-align: center;
            font-size: 13px;
            letter-spacing: 1px;
            color: #d1d5db;
            font-weight: 700;
        }
        .drop-box {
            background: rgba(24, 20, 18, 0.7);
            border: 2px dashed rgba(160, 165, 175, 0.35);
            border-radius: 16px;
            padding: 38px 16px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-bottom: 16px;
        }
        .drop-box:active {
            border-color: #d1d5db;
            background: rgba(30, 25, 22, 0.9);
        }
        .btn {
            width: 100%;
            height: 48px;
            background: #525662;
            color: #e5e7eb;
            border: none;
            border-radius: 14px;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1px;
            cursor: pointer;
            text-transform: uppercase;
            transition: background 0.2s;
        }
        .btn:disabled {
            background: rgba(255, 255, 255, 0.05);
            color: #555b68;
            cursor: not-allowed;
        }
        .progress-bar {
            width: 100%;
            height: 4px;
            background: rgba(24, 20, 18, 0.9);
            border-radius: 2px;
            overflow: hidden;
            display: none;
            margin-bottom: 14px;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: #d1d5db;
            transition: width 0.1s;
        }
        .status {
            text-align: center;
            font-size: 12px;
            min-height: 18px;
            color: #8c909e;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="node-status">Подключено к вашему ПК</div>
        </div>

        <div class="card">
            <div class="drop-box" onclick="document.getElementById('fileInput').click()">
                <div id="selectTitle" style="font-size: 14px; font-weight: 600; color: #b0b5be;">Выбрать файлы</div>
                <div style="font-size: 11px; color: #7b8190; margin-top: 6px;">Нажмите для выбора нескольких файлов</div>
                <input type="file" id="fileInput" multiple style="display:none" onchange="onFilesChosen(event)">
            </div>

            <div class="progress-bar" id="pTrack"><div class="progress-fill" id="pFill"></div></div>
            <button id="sendBtn" class="btn" onclick="sendFiles()" disabled>Отправить на ПК</button>
            <div id="status" class="status">Готов к передаче</div>
        </div>
    </div>

    <script>
        fetch('/api/register-device', { method: 'POST' }).catch(() => {});

        let queueFiles = [];

        function onFilesChosen(e) {
            const files = e.target.files;
            if (files && files.length > 0) {
                for (let i = 0; i < files.length; i++) {
                    queueFiles.push(files[i]);
                }
                document.getElementById('selectTitle').innerText = `Выбрано файлов: ${queueFiles.length}`;
                document.getElementById('selectTitle').style.color = '#d1d5db';
                document.getElementById('sendBtn').disabled = false;
                document.getElementById('status').innerText = 'Нажмите «Отправить на ПК»';
            }
            e.target.value = '';
        }

        function sendFiles() {
            if (queueFiles.length === 0) return;

            const status = document.getElementById('status');
            const pTrack = document.getElementById('pTrack');
            const pFill = document.getElementById('pFill');
            const btn = document.getElementById('sendBtn');
            const selectTitle = document.getElementById('selectTitle');

            const fd = new FormData();
            queueFiles.forEach(file => {
                fd.append('files', file, file.name);
            });

            btn.disabled = true;
            pTrack.style.display = 'block';
            pFill.style.width = '0%';
            status.style.color = '#c5cbd3';
            status.innerText = `Отправка ${queueFiles.length} объектов...`;

            const xhr = new XMLHttpRequest();
            xhr.open('POST', '/api/upload-batch', true);

            xhr.upload.onprogress = (e) => {
                if (e.lengthComputable) {
                    pFill.style.width = Math.round((e.loaded / e.total) * 100) + '%';
                }
            };

            xhr.onload = () => {
                if (xhr.status === 200) {
                    status.style.color = '#d1d5db';
                    status.innerText = `Успешно отправлено файлов: ${queueFiles.length}`;
                    queueFiles = [];
                    selectTitle.innerText = 'Выбрать файлы еще раз';
                    selectTitle.style.color = '#b0b5be';
                    pTrack.style.display = 'none';
                    btn.disabled = true;
                } else {
                    status.style.color = '#a0a5b0';
                    status.innerText = 'Ошибка сохранения';
                    btn.disabled = false;
                }
            };

            xhr.onerror = () => {
                status.style.color = '#a0a5b0';
                status.innerText = 'Сбой сети';
                btn.disabled = false;
            };

            xhr.send(fd);
        }

        setInterval(() => {
            fetch('/api/check-incoming')
                .then(r => r.json())
                .then(d => {
                    if (d.ready) {
                        window.location.href = '/api/download-incoming';
                    }
                })
                .catch(() => {});
        }, 1500);
    </script>
</body>
</html>
